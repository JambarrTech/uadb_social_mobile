org.gradle.jvmargs=-Xmx8G -XX:MaxMetaspaceSize=4G -XX:ReservedCodeCacheSize=512m -XX:+HeapDumpOnOutOfMemoryError
android.useAndroidX=true

# The Kotlin incremental compiler (.tab files) fails when the project and the
# Gradle cache live on different Windows drives:
#   IllegalArgumentException: this and base files have different roots
# which surfaces as "Daemon compilation failed". It shows up as soon as an
# Android plugin shipping Kotlin code is added (image_picker,
# shared_preferences, ...), because those modules get compiled for the first
# time.
# Disabling incremental compilation fixes it portably, since GRADLE_USER_HOME
# normally stays on the system drive (C:) while the project sits on D:.
#
# To keep incremental compilation instead, put GRADLE_USER_HOME on the same
# drive as the project:
#   setx GRADLE_USER_HOME D:\gradle-cache
kotlin.incremental=false

# This newDsl flag was added by the Flutter template
android.newDsl=false
# This builtInKotlin flag was added by the Flutter template
android.builtInKotlin=false

# Network timeout configuration (in milliseconds)
org.gradle.internal.http.connectionTimeout=180000
org.gradle.internal.http.socketTimeout=180000
org.gradle.internal.http.connectionRetry=3

# Use Maven Central as fallback for Gradle Plugin Portal
org.gradle.plugins.allow_insecure_protocol=true
