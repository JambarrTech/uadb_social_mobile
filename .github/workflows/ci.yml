name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

# Least privilege : ce workflow n'a besoin que de lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v7

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Les lints existants (infos/warnings) ne bloquent pas encore :
      # seules les erreurs de compilation sont fatales.
      # À durcir plus tard en `flutter analyze` une fois le dette technique traitée.
      - name: Analyze
        run: flutter analyze --no-fatal-infos --no-fatal-warnings

      - name: Test
        run: flutter test
