name: CI

on:
  push:
    branches: [main, mobile, developpement]
    paths: ["mobile/**", ".github/workflows/ci.yml"]
  pull_request:
    branches: [main, mobile, developpement]
    paths: ["mobile/**", ".github/workflows/ci.yml"]

# Least privilege : ce workflow n'a besoin que de lire le dépôt.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  analyze-and-test:
    name: Flutter analyze + test
    runs-on: ubuntu-latest

    defaults:
      run:
        working-directory: mobile

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Flutter
        uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      - name: Flutter version
        run: flutter --version

      - name: Install dependencies
        run: flutter pub get

      # Analyse stricte : les infos ET les warnings bloquent la CI, afin
      # d'empêcher la réaccumulation de dette technique.
      - name: Analyze
        run: flutter analyze

      - name: Test
        run: flutter test

      # Vérifie que l'application compile pour la cible web (cf. le layout
      # responsive et l'absence de dart:io).
      - name: Build web
        run: flutter build web --release
