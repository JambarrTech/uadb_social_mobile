version: 2

updates:
  # Dépendances Dart/Flutter (pubspec.yaml)
  - package-ecosystem: pub
    directory: "/mobile"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels:
      - dependencies
      - flutter
    commit-message:
      prefix: "deps"

  # Actions GitHub utilisées par la CI
  - package-ecosystem: github-actions
    directory: "/"
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - ci
    commit-message:
      prefix: "ci"

  # Dépendances Gradle (Android)
  - package-ecosystem: gradle
    directory: "/mobile/android"
    schedule:
      interval: monthly
    open-pull-requests-limit: 3
    labels:
      - dependencies
      - android
    commit-message:
      prefix: "build"
